<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <title>Energetska mreža Nigerije</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 95vw;
      height: 90vh;
      margin: 5vh auto;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.1);
      border: 1px solid #e5e7eb;
    }

    .legend {
      padding: 10px 12px;
      background: white;
      line-height: 1.6;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 13px;
    }

    .legend b {
      font-size: 13px;
    }

    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 8px;
      margin-top: 4px;
      opacity: 0.9;
      border-radius: 50%;
      border: 1px solid #fff;
    }

    .layer-toggle {
      padding: 10px 12px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 13px;
      line-height: 1.8;
    }

    .layer-toggle label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      padding: 16px 20px;
      width: min(92vw, 1200px);
      max-height: 90vh;
      overflow: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    #modal-close {
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-body {
      font-size: 14px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .control-row select,
    .control-row button {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
    }

    .control-row button {
      cursor: pointer;
      background: #f9fafb;
    }

    #plot-container {
      min-height: 420px;
    }

    #loading-message {
      color: #4b5563;
      margin-bottom: 10px;
    }

    #error-message {
      color: #b91c1c;
      margin-bottom: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="search-container" style="
    position: fixed;
    top: 20px;
    left: 50px;
    z-index:1001;
  ">
    <div style="
      padding: 8px 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      display: flex;
      gap: 6px;
      align-items: center;
    ">
      <input
        id="search-input"
        type="text"
        placeholder="Naziv stanice..."
        style="padding:4px 8px;font-size:13px;min-width:200px;border:1px solid #d1d5db;border-radius:4px;"
      />
      <button
        id="search-btn"
        style="padding:4px 8px;font-size:13px;border-radius:4px;border:1px solid #d1d5db;background:#f9fafb;cursor:pointer;"
      >
        Pronađi
      </button>
    </div>
  </div>

  <div id="details-modal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Analiza stanice</h2>
        <button id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="station-controls" class="control-row" style="display:none;">
          <label for="feeder-select"><b>Feeder:</b></label>
          <select id="feeder-select"></select>
          <button id="load-plot-btn" type="button">Prikaži graf</button>
        </div>

        <div id="loading-message" style="display:none;">Učitavanje...</div>
        <div id="error-message" style="display:none;"></div>
        <div id="modal-info" style="font-size:13px;color:#4b5563;margin-bottom:12px;"></div>
        <div id="plot-container"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <script>
    const map = L.map('map').setView([9.08, 8.67], 6);

    map.createPane('linesPane');
    map.getPane('linesPane').style.zIndex = 200;

    map.createPane('markersPane');
    map.getPane('markersPane').style.zIndex = 400;

    const lineLayers = {
      feeder33: L.layerGroup(),
      feeder11: L.layerGroup()
    };

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function getLineColor(tip) {
      if (tip === "feeder33") return "#ff9f1a";
      if (tip === "feeder11") return "#00b894";
      return "#636e72";
    }

    function getLineWeight(tip) {
      if (tip === "feeder33") return 4;
      if (tip === "feeder11") return 2.5;
      return 2;
    }

    fetch("/static/nigeria.json")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: { color: "#333", weight: 2, fillOpacity: 0.05, interactive: false }
        }).addTo(map);
      });

    const modalEl = document.getElementById('details-modal');
    const modalTitleEl = document.getElementById('modal-title');
    const modalInfoEl = document.getElementById('modal-info');
    const modalCloseBtn = document.getElementById('modal-close');
    const feederSelectEl = document.getElementById('feeder-select');
    const loadPlotBtnEl = document.getElementById('load-plot-btn');
    const stationControlsEl = document.getElementById('station-controls');
    const loadingMessageEl = document.getElementById('loading-message');
    const errorMessageEl = document.getElementById('error-message');
    const plotContainerEl = document.getElementById('plot-container');

    let currentStationContext = null;
    let allFeatures = [];
    const featureMarkers = {};
    const markersByStationKey = {};
    const defaultMarkerStyleByStationKey = {};
    let allLineLeafletLayers = [];
    let selectedLineLayer = null;

    function clearModalState() {
      stationControlsEl.style.display = 'none';
      loadingMessageEl.style.display = 'none';
      errorMessageEl.style.display = 'none';
      errorMessageEl.textContent = '';
      modalInfoEl.textContent = '';
      feederSelectEl.innerHTML = '';
      plotContainerEl.innerHTML = '';
    }

    function openModal() {
      modalEl.style.display = 'flex';
    }

    function closeModal() {
      modalEl.style.display = 'none';
      clearModalState();
      currentStationContext = null;
    }

    function setLoading(isLoading, message = 'Učitavanje...') {
      loadingMessageEl.style.display = isLoading ? 'block' : 'none';
      loadingMessageEl.textContent = message;
    }

    function setError(message) {
      errorMessageEl.style.display = message ? 'block' : 'none';
      errorMessageEl.textContent = message || '';
    }

    function stationTipToApiType(tip) {
      if (tip === 'distribution') return 'DT';
      if (tip === 'substation') return 'SS';
      if (tip === 'transmission') return 'TS';
      return null;
    }

    async function fetchStationOptions(stationType, stationId) {
      const res = await fetch(`/api/station-options/${stationType}/${stationId}`);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Greška pri učitavanju feeder opcija');
      }
      return data;
    }

    async function fetchStationPlot(stationType, stationId, feederId = null) {
      let url = `/api/station-plot/${stationType}/${stationId}`;
      if (feederId !== null && feederId !== undefined) {
        url += `?feeder_id=${encodeURIComponent(feederId)}`;
      }

      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Greška pri učitavanju grafa');
      }
      return data;
    }

    function renderPlotlyFigure(figure) {
      plotContainerEl.innerHTML = '';
      const plotDiv = document.createElement('div');
      plotDiv.id = 'station-plotly-div';
      plotContainerEl.appendChild(plotDiv);

      Plotly.newPlot(plotDiv, figure.data, figure.layout, {
        responsive: true,
        displaylogo: false
      });
    }

    function populateFeederDropdown(feeders) {
      feederSelectEl.innerHTML = '';

      if (!feeders || feeders.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Nema dostupnih feeder-a';
        feederSelectEl.appendChild(opt);
        return;
      }

      feeders.forEach((f) => {
        const opt = document.createElement('option');
        opt.value = String(f.id);

        let label = `${f.name} [${f.role}]`;
        if (!f.has_readings) {
          label += ' - nema očitanja';
        }

        opt.textContent = label;
        opt.disabled = !f.has_readings;
        feederSelectEl.appendChild(opt);
      });

      const firstEnabled = Array.from(feederSelectEl.options).find(o => !o.disabled);
      if (firstEnabled) {
        feederSelectEl.value = firstEnabled.value;
      }
    }

    async function loadPlotForCurrentSelection() {
      if (!currentStationContext) return;

      const { stationType, stationId } = currentStationContext;
      const feederId = feederSelectEl.value ? parseInt(feederSelectEl.value, 10) : null;

      try {
        setError('');
        setLoading(true, 'Generišem graf...');
        const payload = await fetchStationPlot(stationType, stationId, feederId);
        renderPlotlyFigure(payload.figure);
      } catch (err) {
        plotContainerEl.innerHTML = '';
        setError(err.message);
      } finally {
        setLoading(false);
      }
    }

    async function openStationAnalysis(stationTip, stationId, stationName) {
      const stationType = stationTipToApiType(stationTip);
      if (!stationType || !stationId) return;

      currentStationContext = { stationType, stationId, stationName };
      modalTitleEl.textContent = `${stationName || 'Stanica'} — analiza`;
      clearModalState();
      openModal();
      setLoading(true, 'Učitavam stanicu...');

      try {
        const options = await fetchStationOptions(stationType, stationId);

        if (stationType === 'DT') {
          modalInfoEl.textContent = `DT analiza se generiše direktno za izabranu stanicu.`;
          const payload = await fetchStationPlot(stationType, stationId);
          renderPlotlyFigure(payload.figure);
          return;
        }

        stationControlsEl.style.display = 'flex';
        populateFeederDropdown(options.feeders);

        if (stationType === 'TS') {
          modalInfoEl.textContent = 'Izaberi feeder koji izlazi iz TS stanice.';
        } else if (stationType === 'SS') {
          modalInfoEl.textContent = 'Izaberi feeder povezan sa SS stanicom.';
        }

        const hasEnabledOption = Array.from(feederSelectEl.options).some(o => !o.disabled && o.value);
        if (hasEnabledOption) {
          await loadPlotForCurrentSelection();
        } else {
          setError('Nijedan feeder sa očitanjima nije dostupan za ovu stanicu.');
        }
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    }

    loadPlotBtnEl.addEventListener('click', async () => {
      await loadPlotForCurrentSelection();
    });

    modalCloseBtn.addEventListener('click', closeModal);
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) {
        closeModal();
      }
    });

    function resetAllLines() {
      allLineLeafletLayers.forEach((layer) => {
        const tip = layer.feature?.properties?.tip;
        layer.setStyle({
          color: getLineColor(tip),
          weight: getLineWeight(tip),
          opacity: 0.75
        });
      });
    }

    function resetAllStations() {
      Object.entries(markersByStationKey).forEach(([stationKey, marker]) => {
        const baseStyle = defaultMarkerStyleByStationKey[stationKey];
        if (!baseStyle) return;

        marker.setStyle({
          radius: baseStyle.radius,
          fillColor: baseStyle.fillColor,
          color: baseStyle.color,
          weight: baseStyle.weight,
          fillOpacity: baseStyle.fillOpacity,
          opacity: baseStyle.opacity
        });
      });
    }

    function resetSelectedLine() {
      selectedLineLayer = null;
      resetAllLines();
      resetAllStations();
    }

    function bringLineToFront(layer) {
      if (layer && typeof layer.bringToFront === 'function') {
        layer.bringToFront();
      }
    }

    function dimAllLinesExcept(activeLayer) {
      allLineLeafletLayers.forEach((layer) => {
        const tip = layer.feature?.properties?.tip;

        if (layer === activeLayer) {
          layer.setStyle({
            color: getLineColor(tip),
            weight: getLineWeight(tip) + 5,
            opacity: 1
          });
          bringLineToFront(layer);
        } else {
          layer.setStyle({
            color: "#c7cdd4",
            weight: Math.max(1, getLineWeight(tip) - 0.3),
            opacity: 0.08
          });
        }
      });
    }

    function dimStationsExcept(stationKeysToKeep) {
      const keepSet = new Set(stationKeysToKeep || []);

      Object.entries(markersByStationKey).forEach(([stationKey, marker]) => {
        const baseStyle = defaultMarkerStyleByStationKey[stationKey];
        if (!baseStyle) return;

        if (keepSet.has(stationKey)) {
          marker.setStyle({
            radius: baseStyle.radius + 1,
            fillColor: baseStyle.fillColor,
            color: "#111827",
            weight: 3,
            fillOpacity: 1,
            opacity: 1
          });
        } else {
          marker.setStyle({
            radius: baseStyle.radius,
            fillColor: "#d1d5db",
            color: "#b0b7c3",
            weight: 1,
            fillOpacity: 0.12,
            opacity: 0.18
          });
        }
      });
    }

    function focusOnLine(layer) {
      selectedLineLayer = layer;
      dimAllLinesExcept(layer);
      dimStationsExcept(layer.stationKeys || []);
    }

    map.on('click', function () {
      resetSelectedLine();
    });

    fetch("/data/vodovi")
      .then(res => res.json())
      .then(data => {
        data.features.forEach((feature) => {
          const tip = feature.properties.tip;
          const color = getLineColor(tip);
          const weight = getLineWeight(tip);

          const layer = L.geoJSON(feature, {
            pane: 'linesPane',
            style: {
              color: color,
              weight: weight,
              opacity: 0.75
            },
            onEachFeature: function (f, l) {
              l.stationKeys = f.properties.station_keys || [];
              allLineLeafletLayers.push(l);

              l.bindPopup(`
                <div style="text-align:center">
                  <b style="color:${color}">${tip.toUpperCase()}</b><br>
                  <strong>${f.properties.naziv || "Nepoznat vod"}</strong><br>
                  Povezanih čvorova: ${f.properties.children_count || 0}<br>
                  ${f.properties.nameplate_rating ? `Rating: ${f.properties.nameplate_rating}<br>` : ""}
                </div>
              `);

              l.on('mouseover', function () {
                if (selectedLineLayer !== l) {
                  l.setStyle({
                    weight: getLineWeight(tip) + 1,
                    opacity: 0.95
                  });
                }
              });

              l.on('mouseout', function () {
                if (selectedLineLayer !== l) {
                  l.setStyle({
                    weight: getLineWeight(tip),
                    opacity: 0.75
                  });
                }
              });

              l.on('click', function (e) {
                L.DomEvent.stopPropagation(e);
                focusOnLine(l);

                map.fitBounds(l.getBounds(), {
                  padding: [30, 30]
                });
              });
            }
          });

          if (lineLayers[tip]) {
            lineLayers[tip].addLayer(layer);
          }
        });

        lineLayers.feeder33.addTo(map);
        lineLayers.feeder11.addTo(map);
      })
      .catch(err => console.error("Greška pri učitavanju vodova:", err));

    fetch("/data/trafostanice")
      .then(res => res.json())
      .then(data => {
        allFeatures = data.features;

        const colors = {
          transmission: "#ff4757",
          substation: "#3742fa",
          distribution: "#2ed573"
        };

        const sizeConfig = {
          transmission: 18,
          substation: 13,
          distribution: 7
        };

        const counts = { transmission: 0, substation: 0, distribution: 0 };

        const layers = {
          transmission: L.layerGroup(),
          substation: L.layerGroup(),
          distribution: L.layerGroup()
        };

        allFeatures.forEach((f, idx) => {
          const tip = f.properties.tip;
          const stationId = f.properties.id;
          const stationKey = `${tip}:${stationId}`;

          if (!counts[tip]) counts[tip] = 0;
          counts[tip]++;

          const r = sizeConfig[tip] || 8;
          const color = colors[tip] || "#ffa502";

          const lat = f.geometry.coordinates[1];
          const lon = f.geometry.coordinates[0];

          const marker = L.circleMarker([lat, lon], {
            pane: 'markersPane',
            radius: r,
            fillColor: color,
            color: "#ffffff",
            weight: 1.5,
            fillOpacity: 0.85,
            opacity: 1
          });

          marker.on('click', async (e) => {
            L.DomEvent.stopPropagation(e);
            map.flyTo([lat, lon], 10, { animate: true, duration: 1.0 });
            await openStationAnalysis(tip, stationId, f.properties.naziv);
          });

          marker.bindTooltip(`${f.properties.naziv}`, {
            direction: 'top',
            offset: [0, -6]
          });

          layers[tip].addLayer(marker);
          featureMarkers[idx] = marker;
          markersByStationKey[stationKey] = marker;
          defaultMarkerStyleByStationKey[stationKey] = {
            radius: r,
            fillColor: color,
            color: "#ffffff",
            weight: 1.5,
            fillOpacity: 0.85,
            opacity: 1
          };
        });

        layers.transmission.addTo(map);
        layers.substation.addTo(map);
        layers.distribution.addTo(map);

        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
          const div = L.DomUtil.create('div', 'legend');
          div.innerHTML = '<b>Legenda</b><br>';

          const labels = {
            transmission: 'Transmission (Velike)',
            substation: 'Substation (Srednje)',
            distribution: 'Distribution (Male)'
          };

          ['transmission', 'substation', 'distribution'].forEach(tip => {
            div.innerHTML += `
              <i style="background:${colors[tip]}"></i>
              ${labels[tip]}: <b>${counts[tip] || 0}</b><br>
            `;
          });

          div.innerHTML += `
            <hr style="margin:8px 0;border:none;border-top:1px solid #e5e7eb;">
            <b>Vodovi</b><br>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="width:16px;height:0;border-top:4px solid #ff9f1a;"></span>
              Feeder 33kV
            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
              <span style="width:16px;height:0;border-top:3px solid #00b894;"></span>
              Feeder 11kV
            </div>
            <div style="margin-top:8px;color:#6b7280;font-size:12px;">
              Klik na vod za fokus. Klik na stanicu za analizu.
            </div>
          `;

          return div;
        };
        legend.addTo(map);

        const toggle = L.control({ position: 'topright' });
        toggle.onAdd = function () {
          const div = L.DomUtil.create('div', 'layer-toggle');
          div.innerHTML = '<b>Prikaz slojeva</b><br>';

          div.innerHTML += `
            <label>
              <input type="checkbox" id="chk-transmission" checked />
              Transmission
            </label>
            <label>
              <input type="checkbox" id="chk-substation" checked />
              Substation
            </label>
            <label>
              <input type="checkbox" id="chk-distribution" checked />
              Distribution
            </label>
            <label>
              <input type="checkbox" id="chk-feeder33" checked />
              Feeder 33kV
            </label>
            <label>
              <input type="checkbox" id="chk-feeder11" checked />
              Feeder 11kV
            </label>
          `;

          L.DomEvent.disableClickPropagation(div);
          return div;
        };
        toggle.addTo(map);

        document.getElementById('chk-transmission').addEventListener('change', (e) => {
          if (e.target.checked) map.addLayer(layers.transmission);
          else map.removeLayer(layers.transmission);
        });

        document.getElementById('chk-substation').addEventListener('change', (e) => {
          if (e.target.checked) map.addLayer(layers.substation);
          else map.removeLayer(layers.substation);
        });

        document.getElementById('chk-distribution').addEventListener('change', (e) => {
          if (e.target.checked) map.addLayer(layers.distribution);
          else map.removeLayer(layers.distribution);
        });

        document.getElementById('chk-feeder33').addEventListener('change', (e) => {
          if (e.target.checked) map.addLayer(lineLayers.feeder33);
          else map.removeLayer(lineLayers.feeder33);
        });

        document.getElementById('chk-feeder11').addEventListener('change', (e) => {
          if (e.target.checked) map.addLayer(lineLayers.feeder11);
          else map.removeLayer(lineLayers.feeder11);
        });
      })
      .catch(err => console.error("Greška pri učitavanju stanica:", err));

    function searchStationByName() {
      const input = document.getElementById('search-input');
      const query = input.value.trim().toLowerCase();
      if (!query) return;

      let foundIdx = null;
      for (let i = 0; i < allFeatures.length; i++) {
        const name = (allFeatures[i].properties.naziv || '').toLowerCase();
        if (name.includes(query)) {
          foundIdx = i;
          break;
        }
      }

      if (foundIdx === null) {
        alert(`Nema stanice koja sadrži: "${query}"`);
        return;
      }

      const f = allFeatures[foundIdx];
      const lat = f.geometry.coordinates[1];
      const lon = f.geometry.coordinates[0];

      const marker = featureMarkers[foundIdx];
      if (marker) {
        map.flyTo([lat, lon], 10, { animate: true, duration: 1.0 });
        marker.openTooltip();
      }
    }

    document.getElementById('search-btn').addEventListener('click', searchStationByName);
    document.getElementById('search-input').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        searchStationByName();
      }
    });
  </script>
</body>
</html>
